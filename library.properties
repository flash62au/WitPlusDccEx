paragraph=This library implements the WiThrottle protocol (as used in JMRI and other servers) as well as the DCC-EX Native protocol (used by DCC-EX EX-CommandStations), allowing an ESP32 device to connect to the server and act as a client (such as a dedicated hardware based throttle).
